<svg viewBox="0 0 480 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="1" y="1" width="478" height="518" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="12"/>

  <!-- header -->
  <rect x="1" y="1" width="478" height="46" fill="#ffffff" rx="12"/>
  <line x1="0" y1="47" x2="480" y2="47" stroke="#e2e2e2" stroke-width="1"/>
  <text x="18" y="30" fill="#222" font-size="15" font-weight="bold">Dictation tool settings</text>

  <!-- global keyterms -->
  <text x="18" y="70" fill="#666" font-size="11">Keyterms / vocabulary boost (applies to all providers)</text>
  <rect x="18" y="78" width="444" height="46" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5" rx="6"/>
  <rect x="26" y="90" width="80" height="22" fill="#dce8fb" rx="6"/>
  <text x="34" y="105" fill="#0c447c" font-size="11">kubernetes ×</text>
  <rect x="112" y="90" width="76" height="22" fill="#dce8fb" rx="6"/>
  <text x="120" y="105" fill="#0c447c" font-size="11">Anthropic ×</text>
  <rect x="194" y="90" width="70" height="22" fill="#dce8fb" rx="6"/>
  <text x="202" y="105" fill="#0c447c" font-size="11">Soniox ×</text>
  <text x="272" y="105" fill="#999" font-size="11">Add term, press Enter</text>

  <!-- tabs -->
  <line x1="0" y1="140" x2="480" y2="140" stroke="#e2e2e2" stroke-width="1"/>
  <text x="18" y="162" fill="#185fa5" font-size="13">Soniox</text>
  <line x1="18" y1="170" x2="70" y2="170" stroke="#185fa5" stroke-width="2"/>
  <text x="90" y="162" fill="#666" font-size="13">NVIDIA</text>
  <text x="160" y="162" fill="#666" font-size="13">Groq</text>

  <!-- model -->
  <text x="18" y="200" fill="#666" font-size="11">Model</text>
  <rect x="18" y="208" width="444" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="6"/>
  <text x="28" y="228" fill="#333" font-size="12">stt-rt-v5 (real-time)</text>

  <!-- api key -->
  <text x="18" y="260" fill="#666" font-size="11">API key</text>
  <rect x="18" y="268" width="360" height="30" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5" rx="6"/>
  <text x="28" y="288" fill="#999" font-size="12">•••••••••••••••• saved</text>
  <rect x="386" y="268" width="76" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="6"/>
  <text x="404" y="288" fill="#333" font-size="12">Change</text>

  <!-- language -->
  <text x="18" y="320" fill="#666" font-size="11">Language</text>
  <rect x="18" y="328" width="444" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="6"/>
  <text x="28" y="348" fill="#333" font-size="12">Auto-detect</text>

  <!-- footer -->
  <line x1="0" y1="470" x2="480" y2="470" stroke="#e2e2e2" stroke-width="1"/>
  <rect x="330" y="482" width="66" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="6"/>
  <text x="345" y="500" fill="#333" font-size="12">Cancel</text>
  <rect x="404" y="482" width="58" height="28" fill="#fff" stroke="#185fa5" stroke-width="1" rx="6"/>
  <text x="416" y="500" fill="#185fa5" font-size="12">Save</text>
</svg>
