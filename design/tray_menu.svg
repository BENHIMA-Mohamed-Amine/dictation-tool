<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="460" height="320" fill="#1a1a1a" rx="12"/>

  <!-- top bar -->
  <rect x="0" y="0" width="460" height="32" fill="#0d0d0d"/>
  <text x="330" y="21" fill="#ccc" font-size="13">wifi</text>
  <text x="365" y="21" fill="#ccc" font-size="13">bt</text>
  <text x="392" y="21" fill="#fff" font-size="13">[mic]</text>
  <text x="425" y="21" fill="#ccc" font-size="13">39%</text>

  <!-- dropdown menu -->
  <g transform="translate(180,32)">
    <rect x="0" y="0" width="200" height="60" fill="#2b2b2b" stroke="#444" stroke-width="0.5" rx="8"/>
    <rect x="6" y="6" width="188" height="30" fill="#3a3a3a" rx="6"/>
    <circle cx="100" cy="21" r="8" fill="#e24b4a"/>
    <text x="100" y="25" fill="#fff" font-size="11" text-anchor="middle">MIC</text>

    <line x1="6" y1="44" x2="194" y2="44" stroke="#444" stroke-width="1"/>
  </g>

  <!-- provider row + submenu -->
  <g transform="translate(180,96)">
    <rect x="0" y="0" width="200" height="34" fill="#2b2b2b" stroke="#444" stroke-width="0.5" rx="8"/>
    <text x="10" y="21" fill="#eee" font-size="12">Provider</text>
    <text x="150" y="21" fill="#aaa" font-size="12">Soniox &gt;</text>

    <!-- submenu -->
    <rect x="206" y="-6" width="160" height="100" fill="#2b2b2b" stroke="#444" stroke-width="0.5" rx="8"/>
    <rect x="212" y="0" width="148" height="26" fill="#3a3a3a" rx="6"/>
    <text x="220" y="17" fill="#eee" font-size="12">Soniox ✓</text>
    <text x="220" y="43" fill="#ccc" font-size="12">NVIDIA</text>
    <text x="220" y="69" fill="#ccc" font-size="12">Groq</text>
  </g>

  <!-- settings / quit -->
  <g transform="translate(180,140)">
    <rect x="0" y="0" width="200" height="60" fill="#2b2b2b" stroke="#444" stroke-width="0.5" rx="8"/>
    <text x="10" y="22" fill="#ddd" font-size="12">Settings</text>
    <line x1="6" y1="30" x2="194" y2="30" stroke="#444" stroke-width="1"/>
    <text x="10" y="48" fill="#ddd" font-size="12">Quit</text>
  </g>
</svg>
